name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        working-directory: src
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cmake --preset x64-release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        working-directory: src
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cmake --build --preset x64-release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test
        shell: pwsh
        working-directory: src
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          ctest --test-dir ..\out -C Release -LE ui --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir ..\out -C Release -R '^opus_disk_layout_proof_test$' --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir ..\out -C Release -R '^opus_word1_open_save_roundtrip_test$' --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload saved doc artifact
        uses: actions/upload-artifact@v4
        with:
          name: word1-doc-windows
          path: build/save-proof/word1-open-save-input.doc
          if-no-files-found: error

      - name: Upload layout artifact
        uses: actions/upload-artifact@v4
        with:
          name: word1-layout-windows
          path: build/word1-layout-proof.bin
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ninja sdl2

      - name: Configure
        run: cmake -S src --preset macos-debug

      - name: Build probes
        run: >
          cmake --build out/macos-debug --target
          opus-sdl-probe
          opus_mkcmd_tool
          opus_mkdlg_tool
          opus_mergeelx_tool
          opus_bitapp_tool
          opus_dibapp_tool
          opus_cabi_tool
          opus_generated_commands
          opus_generated_cursors
          opus_generated_embedded_resources
          opus_generated_dib_resources
          opus_generated_dlgcheck
          opus_generated_elxinfo
          opus_original_plc_test
          WORD1

      - name: Test
        run: |
          SDL_VIDEODRIVER=offscreen ./bin/opus-sdl-probe
          ctest --test-dir out/macos-debug -R opus_bitapp_8hdr_test --output-on-failure
          ctest --test-dir out/macos-debug -R '^opus_disk_layout_proof_test$' --output-on-failure
          ctest --test-dir out/macos-debug -R '^opus_word1_open_save_roundtrip_test$' --output-on-failure

      - name: Upload saved doc artifact
        uses: actions/upload-artifact@v4
        with:
          name: word1-doc-macos
          path: build/save-proof/word1-open-save-input.doc
          if-no-files-found: error

      - name: Upload layout artifact
        uses: actions/upload-artifact@v4
        with:
          name: word1-layout-macos
          path: build/word1-layout-proof.bin
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsdl2-dev

      - name: Configure
        run: cmake -S src --preset linux-debug

      - name: Build
        run: cmake --build out/linux-debug --target all opus-sdl-probe

      - name: Test
        run: |
          SDL_VIDEODRIVER=offscreen ./bin/opus-sdl-probe
          ctest --test-dir out/linux-debug -LE ui --output-on-failure
          ctest --test-dir out/linux-debug -R '^opus_disk_layout_proof_test$' --output-on-failure
          ctest --test-dir out/linux-debug -L ui --output-on-failure

      - name: Upload saved doc artifact
        uses: actions/upload-artifact@v4
        with:
          name: word1-doc-linux
          path: build/save-proof/word1-open-save-input.doc
          if-no-files-found: error

      - name: Upload layout artifact
        uses: actions/upload-artifact@v4
        with:
          name: word1-layout-linux
          path: build/word1-layout-proof.bin
          if-no-files-found: error

  compare-saved-bytes:
    runs-on: ubuntu-latest
    needs:
      - windows
      - macos
      - linux
    steps:
      - name: Download saved doc artifacts
        uses: actions/download-artifact@v4
        with:
          path: saved-docs

      - name: Check saved doc artifacts
        run: |
          set -eu
          win_size=$(wc -c < saved-docs/word1-doc-windows/word1-open-save-input.doc)
          mac_size=$(wc -c < saved-docs/word1-doc-macos/word1-open-save-input.doc)
          linux_size=$(wc -c < saved-docs/word1-doc-linux/word1-open-save-input.doc)
          win_hash=$(sha256sum saved-docs/word1-doc-windows/word1-open-save-input.doc | cut -d ' ' -f 1)
          mac_hash=$(sha256sum saved-docs/word1-doc-macos/word1-open-save-input.doc | cut -d ' ' -f 1)
          linux_hash=$(sha256sum saved-docs/word1-doc-linux/word1-open-save-input.doc | cut -d ' ' -f 1)
          win_layout_size=$(wc -c < saved-docs/word1-layout-windows/word1-layout-proof.bin)
          mac_layout_size=$(wc -c < saved-docs/word1-layout-macos/word1-layout-proof.bin)
          linux_layout_size=$(wc -c < saved-docs/word1-layout-linux/word1-layout-proof.bin)
          win_layout_hash=$(sha256sum saved-docs/word1-layout-windows/word1-layout-proof.bin | cut -d ' ' -f 1)
          mac_layout_hash=$(sha256sum saved-docs/word1-layout-macos/word1-layout-proof.bin | cut -d ' ' -f 1)
          linux_layout_hash=$(sha256sum saved-docs/word1-layout-linux/word1-layout-proof.bin | cut -d ' ' -f 1)
          printf 'windows %s bytes %s\nmacos   %s bytes %s\nlinux   %s bytes %s\n' "$win_size" "$win_hash" "$mac_size" "$mac_hash" "$linux_size" "$linux_hash"
          printf 'layout windows %s bytes %s\nlayout macos   %s bytes %s\nlayout linux   %s bytes %s\n' "$win_layout_size" "$win_layout_hash" "$mac_layout_size" "$mac_layout_hash" "$linux_layout_size" "$linux_layout_hash"
          test "$win_size" -gt 0
          test "$mac_size" -gt 0
          test "$linux_size" -gt 0
          test "$win_layout_size" -gt 0
          test "$win_layout_size" -eq "$mac_layout_size"
          test "$mac_layout_size" -eq "$linux_layout_size"
          test "$win_layout_hash" = "$mac_layout_hash"
          test "$mac_layout_hash" = "$linux_layout_hash"
